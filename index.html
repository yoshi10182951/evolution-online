<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolution.io</title><style>
html,body{margin:0;background:#0d1117;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#c{width:100vw;height:100vh;display:block}.ui{position:fixed;z-index:2}.top{top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#111c;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px}.menu{inset:0;display:flex;align-items:center;justify-content:center;background:#0008}.card{width:min(440px,90vw);background:#161b22;padding:24px;border-radius:20px;border:1px solid #ffffff22;text-align:center}.hidden{display:none}.hands{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.hands button,.card button,.card input{font-size:16px;padding:12px 16px;border-radius:12px;border:1px solid #ffffff33;background:#21262d;color:white}.hands button.active{outline:2px solid #58a6ff}.board{right:12px;top:60px;background:#111c;padding:10px;border-radius:12px;font-size:13px;min-width:140px}
</style></head><body><canvas id="c"></canvas><div class="ui top"><div class="pill" id="status">接続中…</div><div class="pill">SPACE 能力</div></div><div class="ui board" id="board"></div><div class="ui hands"><button data-h="rock" class="active">✊</button><button data-h="scissors">✌️</button><button data-h="paper">✋</button></div><div class="ui menu" id="menu"><div class="card"><h1>Evolution.io</h1><p>名前を入力してオンライン参加</p><input id="name" maxlength="16" placeholder="Player"><button id="join">参加する</button><p style="opacity:.7;font-size:13px">マウス移動 / 手を切替 / SPACEで能力</p></div></div><div class="ui menu hidden" id="dead"><div class="card"><h2>GAME OVER</h2><button id="respawn">リスポーン</button></div></div><script src="/socket.io/socket.io.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d'),menu=document.getElementById('menu'),dead=document.getElementById('dead'),status=document.getElementById('status'),board=document.getElementById('board');let W,H,id=null,WORLD=6000,cam={x:3000,y:3000},target={x:3000,y:3000},hand='rock',players=[],foods=[];const icons={rock:'✊',scissors:'✌️',paper:'✋'};function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const socket=io({transports:['websocket','polling']});socket.on('connect',()=>status.textContent='● 接続済み');socket.on('disconnect',()=>status.textContent='○ 再接続中…');socket.on('welcome',d=>{id=d.id;WORLD=d.world;foods=d.foods});socket.on('state',s=>{players=s.players;foods=s.foods;const me=players.find(p=>p.id===id);if(me){cam.x+=(me.x-cam.x)*.25;cam.y+=(me.y-cam.y)*.25;if(!me.alive)dead.classList.remove('hidden')}board.innerHTML='<b>Ranking</b><br>'+[...players].sort((a,b)=>b.score-a.score).slice(0,5).map((p,i)=>`${i+1}. ${p.name} ${p.score}`).join('<br>')});
document.getElementById('join').onclick=()=>{socket.emit('join',document.getElementById('name').value||'Player');menu.classList.add('hidden')};document.getElementById('respawn').onclick=()=>{socket.emit('respawn');dead.classList.add('hidden')};document.querySelectorAll('.hands button').forEach(b=>b.onclick=()=>{hand=b.dataset.h;document.querySelectorAll('.hands button').forEach(q=>q.classList.toggle('active',q===b));socket.emit('input',{x:target.x,y:target.y,hand})});addEventListener('mousemove',e=>{target.x=cam.x+e.clientX-W/2;target.y=cam.y+e.clientY-H/2;socket.emit('input',{x:target.x,y:target.y,hand})});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();socket.emit('ability')}});
function draw(){requestAnimationFrame(draw);x.fillStyle='#0d1117';x.fillRect(0,0,W,H);const me=players.find(p=>p.id===id);for(const f of foods){const sx=f.x-cam.x+W/2,sy=f.y-cam.y+H/2;if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;x.beginPath();x.fillStyle='#8b949e';x.arc(sx,sy,f.r,0,Math.PI*2);x.fill()}for(const p of players){const sx=p.x-cam.x+W/2,sy=p.y-cam.y+H/2;if(sx<-180||sy<-180||sx>W+180||sy>H+180)continue;x.beginPath();x.fillStyle=p.id===id?'#58a6ff':'#f78166';x.arc(sx,sy,p.r,0,Math.PI*2);x.fill();x.fillStyle='white';x.textAlign='center';x.font=Math.max(12,p.r*.55)+'px sans-serif';x.fillText(icons[p.hand],sx,sy+3);x.font='12px sans-serif';x.fillText(p.name,sx,sy-p.r-8)}if(me)status.textContent=`● 接続済み | Size ${Math.round(me.r)} | Score ${me.score}`}draw();
</script></body></html>
